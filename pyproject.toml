# Здесь задаются только настройки инструментов. Проект состоит из одного скрипта
# (main.py), запускаемого командой `python main.py <URL>`; установка через pip
# не предполагается.

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "N", "UP", "SIM", "RUF"]
# Сохраняем typing.Optional / typing.List: они подходят для Python 3.8 и новее.
ignore = ["UP006", "UP007", "UP045"]

[tool.mypy]
strict = true
files = ["main.py"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
